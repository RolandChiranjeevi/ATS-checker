[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cv-ats-check"
version = "0.1.0"
description = "Local, explainable ATS/CV checker. All processing stays on your machine."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "reportlab>=4",
    "ruff>=0.6",
]

[project.scripts]
cv-check = "cv_ats_check.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cv_ats_check = ["reporting/templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# word lists are clearer as one split string; fixtures contain long prose lines
"src/cv_ats_check/nlp/stopwords.py" = ["SIM905", "E501"]
"tests/helpers.py" = ["E501"]
