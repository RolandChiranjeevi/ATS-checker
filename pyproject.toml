[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cv-ats-check"
version = "0.1.0"
description = "Local, explainable ATS/CV checker. All processing stays on your machine."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "jinja2>=3.1",
]

[project.optional-dependencies]
web = ["flask>=3"]
dev = [
    "flask>=3",
    "hypothesis>=6.100",
    "playwright>=1.45",
    "pytest>=8",
    "pytest-cov>=5",
    "reportlab>=4",
    "ruff>=0.6",
]
mutation = ["mutmut>=3"]

[project.scripts]
cv-check = "cv_ats_check.cli:main"
cv-check-web = "cv_ats_check.web:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cv_ats_check = ["reporting/templates/*.j2", "reporting/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "e2e: browser tests in real Chromium (skipped unless `playwright install chromium` was run)",
]

[tool.mutmut]
# Mutation testing (pip install -e ".[mutation]" && mutmut run). Scoped to the pure logic modules.
paths_to_mutate = [
    "src/cv_ats_check/nlp/normalize.py",
    "src/cv_ats_check/checks/date_checks.py",
    "src/cv_ats_check/checks/contact_checks.py",
]
tests_dir = ["tests/"]
also_copy = ["src/"]  # the rest of the package must exist next to the mutated modules
# mutmut copies only the mutated modules, so tests that read other source files are left out.
pytest_add_cli_args = [
    "-m", "not e2e",
    "-k", "not test_server_binds_to_loopback_only",
    "-p", "no:cacheprovider",
    "-W", "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# word lists are clearer as one split string; fixtures contain long prose lines
"src/cv_ats_check/nlp/stopwords.py" = ["SIM905", "E501"]
"tests/helpers.py" = ["E501"]
